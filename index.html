<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppHub Admin Panel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- لا حاجة لديناميك لوحدة المتصفح -->

    <!-- شاشة تسجيل الدخول (يتم عرضها أولاً) -->
    <section id="loginView" class="view login-view" aria-hidden="false">
      <div class="login-card">
        <h1>تسجيل الدخول</h1>
        <p class="muted">لوحة تحكم متجر تطبيقات AppHub</p>
        <form id="loginForm">
          <div class="field">
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" name="username" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">دخول</button>
          <p id="loginError" class="error" hidden></p>
        </form>
      </div>
    </section>

    <!-- لوحة المعلومات الرئيسية -->
    <section id="dashboardView" class="view" aria-hidden="true">
      <div class="view-header">
        <h1>لوحة التحكم</h1>
        <button class="btn btn-primary" id="refreshBtn">تحديث</button>
      </div>

      <!-- الشبكة الإحصائية -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- الصفوف -->
      <div class="cards-row">
        <article class="card">
          <h2>أحدث التطبيقات</h2>
          <div class="table-wrap" id="latestApps"></div>
        </article>
        <article class="card">
          <h2>أكثر التطبيقات تحميلاً</h2>
          <div class="table-wrap" id="topApps"></div>
        </article>
      </div>
    </section>

    <!-- إدارة التطبيقات -->
    <section id="appsView" class="view" aria-hidden="true">
      <div class="view-header">
        <h1>التطبيقات</h1>
        <button class="btn btn-primary" id="addAppBtn">إضافة تطبيق</button>
      </div>
      <div class="table-wrap" id="appsTable"></div>
    </section>

    <!-- إدارة الأقسام -->
    <section id="categoriesView" class="view" aria-hidden="true">
      <div class="view-header">
        <h1>الأقسام</h_HOME_><button class="btn btn-primary" id="addCategoryBtn">إضافة قسم</button>
      </div>
      <div class="table-wrap" id="categoriesTable"></div>
    </section>

    <!-- إصدار التطبيقات -->
    <section id="versionsView" class="view" aria-hidden="true">
      <div class="view-header">
        <h1>الإصدارات</h1>
      </div>
      <div class="filter-row">
        <select id="versionAppFilter">
          <option value="">— جميع التطبيقات —</option>
        </select>
      </div>
      <div class="table-wrap" id="versionsTable"></div>
    </section>

    <!-- الإحصائيات -->
    <section id="statsView" class="view" aria-hidden="true">
      <h1>إحصائيات المتجر</h1>
      <div class="stats-grid" id="statsGridDetail"></div>
    </section>

    <!-- الإعدادات -->
    <section id="settingsView" class="view" aria-hidden="true">
      <h1>إعدادات المتجر</h1>
      <form id="settingsForm" class="form-grid">
        <div class="field">
          <label for="storeName">اسم المتجر</label>
          <input type="text" id="storeName" name="storeName">
        </div>
        <div class="field">
          <label for="welcomeMessage">رسالة ترحيبية</label>
          <input type="text" id="welcomeMessage" name="welcomeMessage">
        </div>
        <div class="field full-width">
          <label for="storeDescription">وصف المتجر</label>
          <textarea id="storeDescription" name="storeDescription" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">حفظ الإعدادات</button>
      </form>
    </section>

    <!-- قالب النوافذ المنبثقة -->
    <template id="modalTpl">
      <div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
          <header class="modal-header">
            <h2 id="modalTitle"></h2>
            <button class="modal-close" aria-label="إغلاق">&times;</button>
          </header>
          <form class="modal-body" id="modalForm"></form>
          <footer class="modal-footer">
            <button type="button" class="btn btn-ghost modal-cancel">إلغاء</button>
            <button type="submit" form="modalForm" class="btn btn-primary">حفظ</button>
          </footer>
        </div>
      </div>
    </template>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
